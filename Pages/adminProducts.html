<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | EnviroCycle Admin</title>
  <link rel="icon" href="./images/favicon.png" type="image/png"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 min-h-screen p-6">
  <header class="flex justify-between items-center p-6">
    <h1 class="text-3xl font-bold text-green-700">EnviroCycle Admin Dashboard</h1>
    <nav>
      <ul class="flex space-x-6">
        <li><a href="adminDashboard.html" class="text-green-800 hover:text-green-600">Dashboard</a></li>
        <li><a href="ad-users.html" class="text-green-800 hover:text-green-600">Users</a></li>
        <li><a href="adminProducts.html" class="text-green-800 font-bold">Products</a></li>
        <li><a href="adminOrders.html" class="text-green-800 hover:text-green-600">Orders</a></li>
        <li><a href="/logout" class="text-green-800 hover:text-green-600">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto py-8">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-green-800">Manage Products</h2>
      <button onclick="document.getElementById('productFormModal').classList.remove('hidden')" class="bg-green-600 text-white py-2 px-6 rounded-lg hover:bg-green-700 shadow-md transition">
        Add New Product
      </button>
    </div>

    <!-- Products Table -->
    <div class="bg-white p-6 rounded-2xl shadow-lg">
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white">
          <thead>
            <tr class="bg-green-700 text-white uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">#</th>
              <th class="py-3 px-6 text-left">Image</th>
              <th class="py-3 px-6 text-left">Name</th>
              <th class="py-3 px-6 text-left">Description</th>
              <th class="py-3 px-6 text-left">Price</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody" class="text-gray-600 text-sm font-light">
            <!-- Rows will be injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Product Modal -->
  <div id="productFormModal" class="hidden fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black opacity-50"></div>
    <div class="bg-white rounded-2xl overflow-hidden shadow-2xl relative z-10 max-w-lg w-full p-8">
      <h3 class="text-2xl font-bold text-green-700 mb-6">Add New Product</h3>
      <form id="addProductForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-semibold mb-1">Product Name</label>
          <input type="text" name="name" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-1">Description</label>
          <textarea name="description" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-1">Price (₹)</label>
            <input type="number" name="price" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-1">Image URL</label>
            <input type="text" name="image" placeholder="https://..." class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
        </div>
        <div class="mt-8 flex justify-end space-x-3">
          <button type="button" onclick="document.getElementById('productFormModal').classList.add('hidden')" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancel</button>
          <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-md">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = {
        name: form.name.value,
        description: form.description.value,
        price: form.price.value,
        image: form.image.value || "https://via.placeholder.com/150"
      };

      const res = await fetch("/api/admin/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (data.success) {
        alert("Product added successfully");
        loadProducts();
        form.reset();
        document.getElementById('productFormModal').classList.add('hidden');
      } else {
        alert(data.message);
      }
    });

    async function loadProducts() {
      const res = await fetch("/api/admin/products");
      const products = await res.json();
      const table = document.getElementById("productTableBody");
      table.innerHTML = "";
      products.forEach((prod, i) => {
        table.innerHTML += `
          <tr class="border-b border-gray-200 hover:bg-green-50">
            <td class="py-3 px-6 text-left">${i + 1}</td>
            <td class="py-3 px-6 text-left">
              <img src="${prod.image}" class="w-12 h-12 object-cover rounded shadow" alt="${prod.name}" onerror="this.src='https://via.placeholder.com/150'" />
            </td>
            <td class="py-3 px-6 text-left font-semibold">${prod.name}</td>
            <td class="py-3 px-6 text-left max-w-xs truncate">${prod.description}</td>
            <td class="py-3 px-6 text-left font-bold text-green-700">₹${prod.price}</td>
            <td class="py-3 px-6 text-center">
              <button onclick="deleteProduct('${prod._id}')" class="text-red-500 hover:text-red-700 font-bold">Delete</button>
            </td>
          </tr>`;
      });
    }

    async function deleteProduct(id) {
      if (confirm("Delete this product?")) {
        await fetch(`/api/admin/products/${id}`, { method: "DELETE" });
        loadProducts();
      }
    }
    loadProducts();
  </script>
</body>
</html>
