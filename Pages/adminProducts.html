<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products | EnviroCycle Admin</title>
  <link rel="icon" href="./images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="bg-mesh"></div>
<div id="toast-container"></div>

<nav class="navbar">
  <a href="adminDashboard.html" class="navbar-brand">EnviroCycle <span>⚙</span></a>
  <ul class="nav-links" id="navLinks" style="display:flex;">
    <li><span style="color:var(--text-muted); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;">Admin Panel</span></li>
  </ul>
  <div id="navAuthArea"><a href="/logout" class="btn-logout">Log Out</a></div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="page-wrapper">
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-section-title">Navigation</div>
      <a href="adminDashboard.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
      <a href="ad-users.html" class="sidebar-link"><span class="sidebar-icon">👥</span> Users</a>
      <a href="adminProducts.html" class="sidebar-link active"><span class="sidebar-icon">🛍️</span> Products</a>
      <a href="adminOrders.html" class="sidebar-link"><span class="sidebar-icon">🚛</span> Pickup Orders</a>
      <div class="sidebar-section-title">Site</div>
      <a href="index.html" class="sidebar-link"><span class="sidebar-icon">🏠</span> Public Site</a>
      <a href="/logout" class="sidebar-link" style="color:#fca5a5;"><span class="sidebar-icon">🚪</span> Logout</a>
    </aside>

    <main class="admin-main">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.75rem;">
        <div>
          <h1 style="font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:0.2rem;">Product Inventory</h1>
          <p style="color:var(--text-secondary); font-size:0.88rem;">Add and manage eco-friendly products in the store.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('productModal')">+ Add Product</button>
      </div>

      <div class="table-wrapper reveal">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Image</th><th>Name</th><th>Description</th><th>Price</th><th>Actions</th></tr>
          </thead>
          <tbody id="productTableBody">
            <tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Add Product Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New Product</h3>
      <button class="modal-close" onclick="closeModal('productModal')">✕</button>
    </div>
    <form id="addProductForm">
      <div class="form-group"><label>Product Name</label><input type="text" name="name" required /></div>
      <div class="form-group"><label>Description</label><textarea name="description" rows="3" required></textarea></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group"><label>Price (₹)</label><input type="number" name="price" required /></div>
        <div class="form-group"><label>Image URL</label><input type="text" name="image" placeholder="https://..." /></div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem;">
        <button type="button" class="btn btn-outline" onclick="closeModal('productModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Product</button>
      </div>
    </form>
  </div>
</div>

<script src="/app.js"></script>
<script>
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.getElementById('addProductForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const res = await fetch('/api/admin/products', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:form.name.value, description:form.description.value, price:form.price.value, image:form.image.value || 'https://via.placeholder.com/150' }) });
    const data = await res.json();
    if (data.success) { showToast('Product added!', 'success'); closeModal('productModal'); form.reset(); loadProducts(); }
    else showToast(data.message || 'Error', 'error');
  });

  async function loadProducts() {
    const res = await fetch('/api/admin/products');
    const products = await res.json();
    const tbody = document.getElementById('productTableBody');
    if (!products.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted);">No products added yet.</td></tr>'; return; }
    tbody.innerHTML = products.map((p, i) => `
      <tr>
        <td style="color:var(--text-muted)">${i+1}</td>
        <td><img src="${p.image}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border-glass);" onerror="this.src='./images/favicon.png'" /></td>
        <td style="font-weight:600">${p.name}</td>
        <td style="color:var(--text-secondary); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.description}</td>
        <td><span style="font-weight:800; color:var(--primary-light);">₹${p.price}</span></td>
        <td><button onclick="deleteProduct('${p._id}')" class="btn btn-danger btn-sm">Delete</button></td>
      </tr>`).join('');
  }

  async function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    await fetch(`/api/admin/products/${id}`, { method:'DELETE' });
    showToast('Product deleted.', 'success');
    loadProducts();
  }

  loadProducts();
</script>
</body>
</html>
