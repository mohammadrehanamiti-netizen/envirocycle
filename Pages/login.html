<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EnviroCycle</title>
  <meta name="description" content="Login to your EnviroCycle account to manage pickups and rewards." />
  <link rel="icon" href="./images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="bg-mesh"></div>
<div id="toast-container"></div>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">EnviroCycle <span>♻</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="pickup.html">Pick Up</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div id="navAuthArea">
    <a href="signup.html" class="btn btn-outline btn-sm">Sign Up</a>
  </div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="page-wrapper" style="display:flex; align-items:center; justify-content:center; padding:5rem 1rem;">
  <div class="form-wrapper">
    <div style="text-align:center; margin-bottom:2rem;">
      <div style="font-size:3rem; margin-bottom:0.75rem;">🌿</div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your EnviroCycle account</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>
      <div id="errorMsg" style="display:none; color:#fca5a5; font-size:0.85rem; margin-bottom:1rem; padding:0.75rem; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); border-radius:8px;"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;" id="loginBtn">
        Sign In →
      </button>
    </form>

    <div class="form-divider">— or —</div>
    <p style="text-align:center; color:var(--text-secondary); font-size:0.88rem;">
      Don't have an account? <a href="signup.html" style="color:var(--primary-light); font-weight:600;">Create one free →</a>
    </p>
  </div>
</div>

<script src="/app.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errDiv = document.getElementById('errorMsg');
    btn.textContent = 'Signing in...';
    btn.disabled = true;
    errDiv.style.display = 'none';

    try {
      const res = await fetch('/login-form', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: e.target.email.value, password: e.target.password.value })
      });
      const data = await res.json();
      if (data.success) {
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = data.redirect, 800);
      } else {
        errDiv.textContent = data.message || 'Invalid credentials.';
        errDiv.style.display = 'block';
        btn.textContent = 'Sign In →';
        btn.disabled = false;
      }
    } catch {
      errDiv.textContent = 'Something went wrong. Please try again.';
      errDiv.style.display = 'block';
      btn.textContent = 'Sign In →';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
