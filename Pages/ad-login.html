<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad-Login | EnviroCycle</title>
  <link rel="icon" href="./images/favicon.png" type="image/png"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 min-h-screen p-6">
  <header class="flex justify-between items-center p-6">
  <h1 class="text-3xl font-bold mb-6 text-green-700">EnviroCycle Admin Dashboard</h1>
    <nav>
        <ul class="flex space-x-6">
          <li><a href="adminDashboard.html" class="text-green-800 hover:text-green-600">Dashboard</a></li>
          <li><a href="ad-users.html" class="text-green-800 hover:text-green-600">Users</a></li>
          <li><a href="adminProducts.html" class="text-green-800 hover:text-green-600">Products</a></li>
          <li><a href="adminOrders.html" class="text-green-800 hover:text-green-600">Orders</a></li>
          <li><a href="ad-login.html" class="text-green-800 font-bold hover:text-green-600">Login</a></li>
        </ul>
    </nav>
</header>
<div class="flex justify-center items-center mt-28">
  <div class="bg-white shadow-md rounded-lg p-8 max-w-md w-full">
      <h2 class="text-3xl font-bold text-green-600 text-center mb-6">Welcome Back</h2>
      <form id="login-form" action="/login-form" method="POST">
          <div class="mb-4">
              <label for="email" class="block text-gray-700">Email Address</label>
              <input type="email" id="email" placeholder="Enter your email" 
                  class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <div class="mb-4">
              <label for="password" class="block text-gray-700">Password</label>
              <input type="password" id="password" placeholder="Enter your password" 
                  class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </div>
          <button type="submit" 
              class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition">
              Log In
          </button>
      </form>
      <p class="text-gray-600 text-center mt-4">Don't have an account? 
          <a href="signup.html" class="text-green-600 hover:underline">Sign Up</a>
      </p>
  </div>
 </div>
<script>
  document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      alert('Login successful');
      window.location.href = 'adminDashboard.html';
    } else {
      alert('Login failed');
    }
  });
</script>
  
</body></html>
