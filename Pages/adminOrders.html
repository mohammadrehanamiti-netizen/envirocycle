<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickup Orders | EnviroCycle Admin</title>
  <link rel="icon" href="./images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="bg-mesh"></div>
<div id="toast-container"></div>

<nav class="navbar">
  <a href="adminDashboard.html" class="navbar-brand">EnviroCycle <span>⚙</span></a>
  <ul class="nav-links" id="navLinks" style="display:flex;">
    <li><span style="color:var(--text-muted); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;">Admin Panel</span></li>
  </ul>
  <div id="navAuthArea"><a href="/logout" class="btn-logout">Log Out</a></div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="page-wrapper">
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-section-title">Navigation</div>
      <a href="adminDashboard.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
      <a href="ad-users.html" class="sidebar-link"><span class="sidebar-icon">👥</span> Users</a>
      <a href="adminProducts.html" class="sidebar-link"><span class="sidebar-icon">🛍️</span> Products</a>
      <a href="adminOrders.html" class="sidebar-link active"><span class="sidebar-icon">🚛</span> Pickup Orders</a>
      <div class="sidebar-section-title">Site</div>
      <a href="index.html" class="sidebar-link"><span class="sidebar-icon">🏠</span> Public Site</a>
      <a href="/logout" class="sidebar-link" style="color:#fca5a5;"><span class="sidebar-icon">🚪</span> Logout</a>
    </aside>

    <main class="admin-main">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.75rem;">
        <div>
          <h1 style="font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:0.2rem;">Pickup Orders</h1>
          <p style="color:var(--text-secondary); font-size:0.88rem;">Manage all scheduled pickup requests.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('pickupModal')">+ Add Pickup</button>
      </div>

      <!-- Search -->
      <div style="margin-bottom:1.25rem;">
        <input type="text" id="searchInput" placeholder="🔍  Search by name or material..." oninput="filterPickups()" style="background:var(--bg-card); border:1px solid var(--border-glass); border-radius:10px; padding:0.7rem 1rem; color:var(--text-primary); font-family:'Inter',sans-serif; font-size:0.9rem; width:100%; max-width:400px; outline:none;" />
      </div>

      <div class="table-wrapper reveal">
        <table class="data-table">
          <thead>
            <tr><th>#</th><th>Customer</th><th>Address</th><th>Date</th><th>Material</th><th>Actions</th></tr>
          </thead>
          <tbody id="pickupTableBody">
            <tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Add Pickup Modal -->
<div class="modal-overlay" id="pickupModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add Manual Pickup</h3>
      <button class="modal-close" onclick="closeModal('pickupModal')">✕</button>
    </div>
    <form id="addPickupForm">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group"><label>Customer Name</label><input type="text" name="name" required /></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
      </div>
      <div class="form-group"><label>Address</label><input type="text" name="address" required /></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group"><label>Date</label><input type="date" name="date" required /></div>
        <div class="form-group"><label>Material Type</label><input type="text" name="materialType" placeholder="plastic, paper..." required /></div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem;">
        <button type="button" class="btn btn-outline" onclick="closeModal('pickupModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Pickup</button>
      </div>
    </form>
  </div>
</div>

<script src="/app.js"></script>
<script>
  let allPickups = [];
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.getElementById('addPickupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const res = await fetch('/submit-pickup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:form.name.value, email:form.email.value, address:form.address.value, date:form.date.value, materialType:form.materialType.value }) });
    const data = await res.json();
    if (data.success) { showToast('Pickup added!', 'success'); closeModal('pickupModal'); form.reset(); loadPickups(); }
    else showToast(data.message || 'Error', 'error');
  });

  async function loadPickups() {
    const res = await fetch('/api/admin/pickups');
    allPickups = await res.json();
    renderPickups(allPickups);
  }

  function renderPickups(pickups) {
    const tbody = document.getElementById('pickupTableBody');
    if (!pickups.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted);">No pickup orders yet.</td></tr>'; return; }
    tbody.innerHTML = pickups.map((p, i) => `
      <tr>
        <td style="color:var(--text-muted)">${i+1}</td>
        <td>
          <div style="font-weight:600">${p.name}</div>
          <div style="font-size:0.78rem; color:var(--text-muted)">${p.email}</div>
        </td>
        <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary);">${p.address}</td>
        <td style="color:var(--text-secondary);">${new Date(p.date).toLocaleDateString('en-IN')}</td>
        <td><span class="badge badge-blue">${p.materialType || '—'}</span></td>
        <td><button onclick="deletePickup('${p._id}')" class="btn btn-danger btn-sm">Delete</button></td>
      </tr>`).join('');
  }

  function filterPickups() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderPickups(allPickups.filter(p => p.name.toLowerCase().includes(q) || (p.materialType || '').toLowerCase().includes(q)));
  }

  async function deletePickup(id) {
    if (!confirm('Delete this pickup order?')) return;
    await fetch(`/api/admin/pickups/${id}`, { method: 'DELETE' });
    showToast('Pickup deleted.', 'success');
    loadPickups();
  }

  loadPickups();
</script>
</body>
</html>
