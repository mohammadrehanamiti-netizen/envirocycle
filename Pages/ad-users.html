<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad-Users | EnviroCycle</title>
  <link rel="icon" href="./images/favicon.png" type="image/png"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 min-h-screen p-6">
  <header class="flex justify-between items-center p-6">
    <h1 class="text-3xl font-bold text-green-700">EnviroCycle Admin Dashboard</h1>
    <nav>
      <ul class="flex space-x-6">
        <li><a href="adminDashboard.html" class="text-green-800 hover:text-green-600">Dashboard</a></li>
        <li><a href="ad-users.html" class="text-green-800 font-bold">Users</a></li>
        <li><a href="adminProducts.html" class="text-green-800 hover:text-green-600">Products</a></li>
        <li><a href="adminOrders.html" class="text-green-800 hover:text-green-600">Orders</a></li>
        <li><a href="/logout" class="text-green-800 hover:text-green-600">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto py-8">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-green-800">Manage Users</h2>
      <button onclick="document.getElementById('userFormModal').classList.remove('hidden')" class="bg-green-600 text-white py-2 px-6 rounded-lg hover:bg-green-700 shadow-md transition">
        Add New User
      </button>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-lg">
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white">
          <thead>
            <tr class="bg-green-700 text-white uppercase text-sm leading-normal">
              <th class="py-3 px-6 text-left">#</th>
              <th class="py-3 px-6 text-left">Name</th>
              <th class="py-3 px-6 text-left">Email</th>
              <th class="py-3 px-6 text-left">Role</th>
              <th class="py-3 px-6 text-left">Points</th>
              <th class="py-3 px-6 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="text-gray-600 text-sm font-light">
            <!-- Rows will be injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add User Modal -->
  <div id="userFormModal" class="hidden fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black opacity-50"></div>
    <div class="bg-white rounded-2xl overflow-hidden shadow-2xl relative z-10 max-w-lg w-full p-8">
      <h3 class="text-2xl font-bold text-green-700 mb-6">Add New User</h3>
      <form id="addUserForm" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-1">Name</label>
            <input type="text" name="name" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-1">Email</label>
            <input type="email" name="email" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-1">Phone</label>
            <input type="text" name="phone" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-1">Password</label>
            <input type="password" name="password" required class="w-full p-3 border border-green-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
        </div>
        <div class="mt-8 flex justify-end space-x-3">
          <button type="button" onclick="document.getElementById('userFormModal').classList.add('hidden')" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancel</button>
          <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-md">Add User</button>
        </div>
      </form>
    </div>
  </div>

<script>
  document.getElementById("addUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const body = {
      name: form.name.value,
      email: form.email.value,
      phone: form.phone.value,
      password: form.password.value,
      role: "user"
    };

    const res = await fetch("/submit-form", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    if (data.success) {
      alert("User added successfully");
      loadUsers();
      form.reset();
      document.getElementById('userFormModal').classList.add('hidden');
    } else {
      alert(data.message);
    }
  });

  async function loadUsers() {
    const response = await fetch("/api/admin/users");
    const users = await response.json();
    const table = document.getElementById("userTableBody");
    table.innerHTML = "";
    users.forEach((u, i) => {
      table.innerHTML += `
        <tr class="border-b border-gray-200 hover:bg-green-50">
          <td class="py-3 px-6 text-left">${i + 1}</td>
          <td class="py-3 px-6 text-left font-semibold">${u.name}</td>
          <td class="py-3 px-6 text-left">${u.email}</td>
          <td class="py-3 px-6 text-left"><span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-bold">${u.role}</span></td>
          <td class="py-3 px-6 text-left font-bold text-green-600">${u.points}</td>
          <td class="py-3 px-6 text-center">
            <button onclick="deleteUser('${u._id}')" class="text-red-500 hover:text-red-700 font-bold">Delete</button>
          </td>
        </tr>`;
    });
  }

  async function deleteUser(id) {
    if (confirm("Delete this user?")) {
      await fetch(`/api/admin/users/${id}`, { method: "DELETE" });
      loadUsers();
    }
  }

  loadUsers();
</script>
</body>
</html>
