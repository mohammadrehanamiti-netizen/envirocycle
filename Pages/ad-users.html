<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users | EnviroCycle Admin</title>
  <link rel="icon" href="./images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="bg-mesh"></div>
<div id="toast-container"></div>

<nav class="navbar">
  <a href="adminDashboard.html" class="navbar-brand">EnviroCycle <span>⚙</span></a>
  <ul class="nav-links" id="navLinks" style="display:flex;">
    <li><span style="color:var(--text-muted); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;">Admin Panel</span></li>
  </ul>
  <div id="navAuthArea"><a href="/logout" class="btn-logout">Log Out</a></div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="page-wrapper">
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-section-title">Navigation</div>
      <a href="adminDashboard.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
      <a href="ad-users.html" class="sidebar-link active"><span class="sidebar-icon">👥</span> Users</a>
      <a href="adminProducts.html" class="sidebar-link"><span class="sidebar-icon">🛍️</span> Products</a>
      <a href="adminOrders.html" class="sidebar-link"><span class="sidebar-icon">🚛</span> Pickup Orders</a>
      <div class="sidebar-section-title">Site</div>
      <a href="index.html" class="sidebar-link"><span class="sidebar-icon">🏠</span> Public Site</a>
      <a href="/logout" class="sidebar-link" style="color:#fca5a5;"><span class="sidebar-icon">🚪</span> Logout</a>
    </aside>

    <main class="admin-main">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.75rem;">
        <div>
          <h1 style="font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:0.2rem;">Manage Users</h1>
          <p style="color:var(--text-secondary); font-size:0.88rem;">View and manage registered user accounts.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('userModal')">+ Add User</button>
      </div>

      <!-- Search -->
      <div style="margin-bottom:1.25rem;">
        <input type="text" id="searchInput" placeholder="🔍  Search by name or email..." oninput="filterUsers()" style="background:var(--bg-card); border:1px solid var(--border-glass); border-radius:10px; padding:0.7rem 1rem; color:var(--text-primary); font-family:'Inter',sans-serif; font-size:0.9rem; width:100%; max-width:400px; outline:none;" />
      </div>

      <div class="table-wrapper reveal">
        <table class="data-table" id="usersTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Points</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="7" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Add User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New User</h3>
      <button class="modal-close" onclick="closeModal('userModal')">✕</button>
    </div>
    <form id="addUserForm">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group"><label>Name</label><input type="text" name="name" required /></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required /></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group"><label>Phone</label><input type="text" name="phone" required /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required /></div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem;">
        <button type="button" class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Add User</button>
      </div>
    </form>
  </div>
</div>

<script src="/app.js"></script>
<script>
  let allUsers = [];

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.getElementById('addUserForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const res = await fetch('/submit-form', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:form.name.value, email:form.email.value, phone:form.phone.value, password:form.password.value, role:'user' }) });
    const data = await res.json();
    if (data.success) { showToast('User added successfully!', 'success'); closeModal('userModal'); form.reset(); loadUsers(); }
    else showToast(data.message || 'Error adding user', 'error');
  });

  async function loadUsers() {
    const res = await fetch('/api/admin/users');
    allUsers = await res.json();
    renderUsers(allUsers);
  }

  function renderUsers(users) {
    const tbody = document.getElementById('userTableBody');
    if (!users.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted);">No users found.</td></tr>'; return; }
    tbody.innerHTML = users.map((u, i) => `
      <tr>
        <td style="color:var(--text-muted)">${i+1}</td>
        <td><div style="font-weight:600">${u.name}</div></td>
        <td style="color:var(--text-secondary)">${u.email}</td>
        <td style="color:var(--text-secondary)">${u.phone || '—'}</td>
        <td><span class="badge ${u.role === 'admin' ? 'badge-yellow' : 'badge-green'}">${u.role}</span></td>
        <td><span style="font-weight:700; color:var(--primary-light)">${u.points || 0}</span></td>
        <td><button onclick="deleteUser('${u._id}')" class="btn btn-danger btn-sm">Delete</button></td>
      </tr>`).join('');
  }

  function filterUsers() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderUsers(allUsers.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)));
  }

  async function deleteUser(id) {
    if (!confirm('Delete this user? This cannot be undone.')) return;
    await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
    showToast('User deleted.', 'success');
    loadUsers();
  }

  loadUsers();
</script>
</body>
</html>
